services:
  postgres:
    image: postgres:17
    container_name: matchme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: matchme
      POSTGRES_USER: matchme_user
      POSTGRES_PASSWORD: mp01
    ports:
      - "5433:5432"
    volumes:
      - matchme_postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchme_user -d matchme"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  matchme_postgres_data: