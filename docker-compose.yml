services:
  postgres:
    image: postgres:17
    container_name: matchme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: matchme
      POSTGRES_USER: matchme_user
      POSTGRES_PASSWORD: mp01
    ports:
      - "5433:5432"
    volumes:
      - matchme_postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchme_user -d matchme"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./server
    container_name: matchme-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/matchme
      SPRING_DATASOURCE_USERNAME: matchme_user
      SPRING_DATASOURCE_PASSWORD: mp01
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./client
    container_name: matchme-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  matchme_postgres_data: